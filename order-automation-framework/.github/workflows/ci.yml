name: Order Automation Framework CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      groups:
        description: 'TestNG group to run (smoke/regression/all)'
        required: false
        default: 'all'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build
        run: mvn -B clean compile

      - name: Run tests
        run: mvn -B test

      - name: Archive Extent HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/extent-reports/

      - name: Archive Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: target/logs/
