name: Order Automation Framework CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      groups:
        description: 'TestNG group to run (smoke/regression/all)'
        required: false
        default: 'all'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build
        run: mvn -B -f order-automation-framework/pom.xml clean compile

      - name: Run tests
        run: mvn -B -f order-automation-framework/pom.xml -Dgroups=${{ github.event.inputs.groups || 'all' }} test

      - name: Publish Surefire test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Surefire Test Report
          path: order-automation-framework/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Archive Extent HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: order-automation-framework/target/extent-reports/

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: order-automation-framework/target/logs/